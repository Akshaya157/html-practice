
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey Form</title>
</head>
<body>

    <h1 id="title">Student Survey Form</h1>

    <p id="description">
        Please fill out this survey form to share your details and preferences.
    </p>

    <form id="survey-form">

        <!-- Name -->
        <label id="name-label" for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <br><br>

        <!-- Email -->
        <label id="email-label" for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <br><br>

        <!-- Age -->
        <label id="number-label" for="number">Age:</label>
        <input type="number" id="number" min="18" max="60"
        placeholder="Enter your age">

        <br><br>

        <!-- Dropdown -->
        <label for="dropdown">Choose your department:</label>
        <select id="dropdown">
            <option value="">Select department</option>
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="it">IT</option>
        </select>

        <br><br>

        <!-- Radio Buttons -->
        <p>What is your current year?</p>

        <input type="radio" name="year" value="1st">
        <label>1st Year</label>

        <input type="radio" name="year" value="2nd">
        <label>2nd Year</label>

        <input type="radio" name="year" value="3rd">
        <label>3rd Year</label>

        <br><br>

        <!-- Checkboxes -->
        <p>Which skills do you know?</p>

        <input type="checkbox" value="html">
        <label>HTML</label>

        <input type="checkbox" value="css">
        <label>CSS</label>

        <input type="checkbox" value="python">
        <label>Python</label>

        <input type="checkbox" value="java">
        <label>Java</label>

        <br><br>

        <!-- Comments -->
        <label for="comments">Additional Comments:</label>
        <br>
        <textarea id="comments" placeholder="Enter your comments here"></textarea>

        <br><br>

        <!-- Submit -->
        <button type="submit" id="submit">Submit</button>

    </form>

</body>
</html>
